[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixed-income-portfolio-analytics"
version = "0.1.0"
description = "Loads, validates and analyses a fixed-income portfolio, served as a Plotly Dash dashboard."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "dash>=2.17",
    "plotly>=5.22",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
serve = ["gunicorn>=22.0"]

[project.scripts]
# Installed as console scripts so the systemd unit on EC2 does not need to know
# where the interpreter or the source tree live.
portfolio-load = "portfolio.load.loader:main"
portfolio-serve = "portfolio.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"portfolio.app" = ["assets/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --tb=short"
